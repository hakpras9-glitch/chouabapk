name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Find APK
      run: |
        mkdir -p apk-output
        find . -type f -name "*.apk" -not -path "./.git/*" -exec cp {} apk-output/ \;
        ls -lh apk-output

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: apk-output/*.apk
        if-no-files-found: error
